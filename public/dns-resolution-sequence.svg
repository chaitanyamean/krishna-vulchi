<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- Background -->
  <rect width="1100" height="680" fill="#0f1117" rx="12"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">DNS Resolution — api.farmerapp.com</text>

  <!-- ═══ ACTOR BOXES (top) ═══ -->
  <!-- x positions: App=80, Stub=230, Recursive=390, Root=540, TLD=680, Auth=860 -->

  <rect x="30"  y="52" width="100" height="30" rx="6" fill="#0f766e" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="80"  y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#ccfbf1">Application</text>

  <rect x="180" y="52" width="100" height="30" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="230" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#bfdbfe">Stub Resolver</text>

  <rect x="340" y="52" width="110" height="30" rx="6" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
  <text x="395" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#e0e7ff">Recursive Resolver</text>

  <rect x="510" y="52" width="70" height="30" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="1.5"/>
  <text x="545" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#c7d2fe">Root</text>

  <rect x="640" y="52" width="70" height="30" rx="6" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="675" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#ddd6fe">TLD (.com)</text>

  <rect x="790" y="52" width="120" height="30" rx="6" fill="#1a1f10" stroke="#4ade80" stroke-width="1.5"/>
  <text x="850" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#bbf7d0">Authoritative DNS</text>

  <!-- ═══ LIFELINES ═══ -->
  <line x1="80"  y1="82" x2="80"  y2="610" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="230" y1="82" x2="230" y2="610" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="395" y1="82" x2="395" y2="610" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="545" y1="82" x2="545" y2="610" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="675" y1="82" x2="675" y2="610" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="850" y1="82" x2="850" y2="610" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ═══ CACHE HIT BOX ═══ -->
  <rect x="230" y="110" width="620" height="56" rx="6" fill="#0f1a2e" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="238" y="126" font-size="9" font-weight="700" fill="#60a5fa">alt  [Cache hit — answer already in resolver cache]</text>
  <!-- cached answer arrow -->
  <line x1="395" y1="138" x2="232" y2="138" stroke="#60a5fa" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="232,134 224,138 232,142" fill="#60a5fa"/>
  <text x="310" y="132" text-anchor="middle" font-size="9" fill="#60a5fa">Cached answer (IP + TTL remaining)</text>

  <!-- ═══ CACHE MISS BOX ═══ -->
  <rect x="230" y="174" width="680" height="326" rx="6" fill="#0f1117" stroke="#475569" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="238" y="190" font-size="9" font-weight="700" fill="#94a3b8">alt  [Cache miss — full resolution needed]</text>

  <!-- Step 1: App → Stub -->
  <line x1="82"  y1="218" x2="228" y2="218" stroke="#14b8a6" stroke-width="1.5"/>
  <polygon points="228,214 236,218 228,222" fill="#14b8a6"/>
  <text x="155" y="212" text-anchor="middle" font-size="9" fill="#94a3b8">① resolve api.farmerapp.com</text>

  <!-- Step 2: Stub → Recursive -->
  <line x1="232" y1="240" x2="392" y2="240" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="392,236 400,240 392,244" fill="#3b82f6"/>
  <text x="312" y="234" text-anchor="middle" font-size="9" fill="#94a3b8">② Query A / AAAA for api.farmerapp.com</text>

  <!-- Step 3: Recursive → Root -->
  <line x1="398" y1="262" x2="542" y2="262" stroke="#818cf8" stroke-width="1.5"/>
  <polygon points="542,258 550,262 542,266" fill="#818cf8"/>
  <text x="470" y="256" text-anchor="middle" font-size="9" fill="#94a3b8">③ Where is .com?</text>

  <!-- Step 4: Root → Recursive (referral) -->
  <line x1="542" y1="284" x2="398" y2="284" stroke="#818cf8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="398,280 390,284 398,288" fill="#818cf8"/>
  <text x="470" y="278" text-anchor="middle" font-size="9" fill="#64748b">④ Referral — ask .com name servers</text>

  <!-- Step 5: Recursive → TLD -->
  <line x1="398" y1="310" x2="672" y2="310" stroke="#a78bfa" stroke-width="1.5"/>
  <polygon points="672,306 680,310 672,314" fill="#a78bfa"/>
  <text x="535" y="304" text-anchor="middle" font-size="9" fill="#94a3b8">⑤ Where is farmerapp.com?</text>

  <!-- Step 6: TLD → Recursive (NS records) -->
  <line x1="672" y1="332" x2="398" y2="332" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="398,328 390,332 398,336" fill="#a78bfa"/>
  <text x="535" y="326" text-anchor="middle" font-size="9" fill="#64748b">⑥ NS records for farmerapp.com</text>

  <!-- Step 7: Recursive → Authoritative -->
  <line x1="398" y1="358" x2="848" y2="358" stroke="#4ade80" stroke-width="1.5"/>
  <polygon points="848,354 856,358 848,362" fill="#4ade80"/>
  <text x="623" y="352" text-anchor="middle" font-size="9" fill="#94a3b8">⑦ Resolve api.farmerapp.com</text>

  <!-- Step 8: Authoritative → Recursive (A record + TTL) -->
  <line x1="848" y1="380" x2="398" y2="380" stroke="#4ade80" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="398,376 390,380 398,384" fill="#4ade80"/>
  <text x="623" y="374" text-anchor="middle" font-size="9" fill="#64748b">⑧ A 203.0.113.42  TTL 300</text>

  <!-- Step 9: Recursive caches + replies to Stub -->
  <rect x="370" y="394" width="50" height="14" rx="3" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="395" y="404" text-anchor="middle" font-size="8" fill="#fbbf24">cache</text>
  <line x1="392" y1="420" x2="232" y2="420" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="232,416 224,420 232,424" fill="#3b82f6"/>
  <text x="312" y="414" text-anchor="middle" font-size="9" fill="#64748b">⑨ Answer — 203.0.113.42</text>

  <!-- Step 10: Stub → App -->
  <line x1="228" y1="446" x2="82"  y2="446" stroke="#14b8a6" stroke-width="1.4" stroke-dasharray="5,3"/>
  <polygon points="82,442 74,446 82,450" fill="#14b8a6"/>
  <text x="155" y="440" text-anchor="middle" font-size="9" fill="#64748b">⑩ Address result — 203.0.113.42</text>

  <!-- ═══ ACTOR BOXES (bottom) ═══ -->
  <rect x="30"  y="614" width="100" height="30" rx="6" fill="#0f766e" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="80"  y="634" text-anchor="middle" font-size="11" font-weight="700" fill="#ccfbf1">Application</text>

  <rect x="180" y="614" width="100" height="30" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="230" y="634" text-anchor="middle" font-size="11" font-weight="700" fill="#bfdbfe">Stub Resolver</text>

  <rect x="340" y="614" width="110" height="30" rx="6" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
  <text x="395" y="634" text-anchor="middle" font-size="11" font-weight="700" fill="#e0e7ff">Recursive Resolver</text>

  <rect x="510" y="614" width="70" height="30" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="1.5"/>
  <text x="545" y="634" text-anchor="middle" font-size="11" font-weight="700" fill="#c7d2fe">Root</text>

  <rect x="640" y="614" width="70" height="30" rx="6" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="675" y="634" text-anchor="middle" font-size="11" font-weight="700" fill="#ddd6fe">TLD (.com)</text>

  <rect x="790" y="614" width="120" height="30" rx="6" fill="#1a1f10" stroke="#4ade80" stroke-width="1.5"/>
  <text x="850" y="634" text-anchor="middle" font-size="11" font-weight="700" fill="#bbf7d0">Authoritative DNS</text>

  <!-- ═══ LEGEND ═══ -->
  <rect x="970" y="110" width="118" height="106" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="1029" y="128" text-anchor="middle" font-size="9" font-weight="600" fill="#94a3b8">Legend</text>
  <line x1="978" y1="142" x2="1010" y2="142" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1014" y="146" font-size="9" fill="#94a3b8">query / request</text>
  <line x1="978" y1="160" x2="1010" y2="160" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="1014" y="164" font-size="9" fill="#94a3b8">response</text>
  <rect x="978" y="172" width="18" height="10" rx="2" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="1014" y="181" font-size="9" fill="#94a3b8">resolver cache</text>
  <text x="978" y="200" font-size="8" fill="#475569">TTL 300 = cached</text>
  <text x="978" y="210" font-size="8" fill="#475569">for 5 minutes</text>

</svg>
