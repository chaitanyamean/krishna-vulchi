<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 860" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- Background -->
  <rect width="960" height="860" fill="#0f1117" rx="12"/>

  <!-- ═══════════════════════════════════════
       TITLE
  ═══════════════════════════════════════ -->
  <text x="480" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#e2e8f0">Transaction Management in Spring Boot</text>

  <!-- ═══════════════════════════════════════
       SECTION A — CORE FLOW (left column)
  ═══════════════════════════════════════ -->

  <!-- ── Client ── -->
  <rect x="60" y="62" width="520" height="54" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8">HTTP Client  (shop staff / API consumer)</text>
  <text x="320" y="104" text-anchor="middle" font-size="10" fill="#64748b">POST /api/sales   ·   GET /api/sales/{id}   ·   JSESSIONID cookie</text>

  <!-- arrow client → proxy -->
  <line x1="320" y1="116" x2="320" y2="150" stroke="#475569" stroke-width="1.5"/>
  <polygon points="316,150 324,150 320,158" fill="#475569"/>

  <!-- ── Spring AOP Proxy ── -->
  <rect x="60" y="158" width="520" height="54" rx="8" fill="#1e293b" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="320" y="181" text-anchor="middle" font-size="12" font-weight="600" fill="#a78bfa">Spring AOP Proxy  (@Transactional interceptor)</text>
  <text x="175" y="200" text-anchor="middle" font-size="10" fill="#7c3aed">BEGIN transaction</text>
  <text x="320" y="200" text-anchor="middle" font-size="10" fill="#64748b">·</text>
  <text x="430" y="200" text-anchor="middle" font-size="10" fill="#10b981">COMMIT on success</text>
  <text x="320" y="200" text-anchor="middle" font-size="10" fill="#64748b">·</text>

  <!-- rollback note -->
  <text x="550" y="181" text-anchor="start" font-size="9" fill="#ef4444">ROLLBACK on</text>
  <text x="550" y="193" text-anchor="start" font-size="9" fill="#ef4444">unchecked exception</text>

  <!-- arrow proxy → service -->
  <line x1="320" y1="212" x2="320" y2="246" stroke="#475569" stroke-width="1.5"/>
  <polygon points="316,246 324,246 320,254" fill="#475569"/>

  <!-- ── SalesService ── -->
  <rect x="60" y="254" width="520" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">SalesService</text>

  <!-- write method -->
  <rect x="76" y="288" width="235" height="82" rx="5" fill="#0f1f17" stroke="#065f46" stroke-width="1.2"/>
  <text x="194" y="306" text-anchor="middle" font-size="10" font-weight="600" fill="#6ee7b7">@Transactional</text>
  <text x="194" y="321" text-anchor="middle" font-size="10" fill="#94a3b8">createSale()</text>
  <text x="194" y="337" text-anchor="middle" font-size="9" fill="#64748b">1. validate farmer (read)</text>
  <text x="194" y="350" text-anchor="middle" font-size="9" fill="#64748b">2. save Transaction header</text>
  <text x="194" y="363" text-anchor="middle" font-size="9" fill="#64748b">3. save TransactionItems</text>

  <!-- read method -->
  <rect x="329" y="288" width="235" height="82" rx="5" fill="#0f1a2e" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="447" y="306" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">@Transactional(readOnly = true)</text>
  <text x="447" y="321" text-anchor="middle" font-size="10" fill="#94a3b8">getSale()</text>
  <text x="447" y="337" text-anchor="middle" font-size="9" fill="#64748b">no row locking</text>
  <text x="447" y="350" text-anchor="middle" font-size="9" fill="#64748b">no dirty checking</text>
  <text x="447" y="363" text-anchor="middle" font-size="9" fill="#64748b">read-replica eligible</text>

  <!-- audit call arrow -->
  <line x1="320" y1="384" x2="320" y2="412" stroke="#475569" stroke-width="1.5"/>
  <polygon points="316,412 324,412 320,420" fill="#475569"/>
  <text x="328" y="400" font-size="9" fill="#64748b">auditService.record()</text>

  <!-- ── AuditService (REQUIRED propagation) ── -->
  <rect x="60" y="420" width="520" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="443" text-anchor="middle" font-size="12" font-weight="600" fill="#fbbf24">AuditService  @Transactional (REQUIRED)</text>
  <text x="320" y="461" text-anchor="middle" font-size="10" fill="#64748b">joins existing transaction — rolls back with createSale() if an error occurs</text>

  <!-- arrow service → repos -->
  <line x1="320" y1="472" x2="320" y2="506" stroke="#475569" stroke-width="1.5"/>
  <polygon points="316,506 324,506 320,514" fill="#475569"/>

  <!-- ── Repositories ── -->
  <rect x="60" y="514" width="520" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="537" text-anchor="middle" font-size="12" font-weight="600" fill="#fb923c">JPA Repositories  (Hibernate / Spring Data)</text>
  <text x="170" y="557" text-anchor="middle" font-size="10" fill="#64748b">TransactionRepository</text>
  <text x="320" y="557" text-anchor="middle" font-size="10" fill="#64748b">TransactionItemRepository</text>
  <text x="480" y="557" text-anchor="middle" font-size="10" fill="#64748b">AuditLogRepository</text>

  <!-- arrow repos → DB -->
  <line x1="320" y1="574" x2="320" y2="608" stroke="#475569" stroke-width="1.5"/>
  <polygon points="316,608 324,608 320,616" fill="#475569"/>

  <!-- ── PostgreSQL ── -->
  <rect x="60" y="616" width="520" height="72" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="639" text-anchor="middle" font-size="12" font-weight="600" fill="#38bdf8">PostgreSQL  (READ_COMMITTED isolation — default)</text>
  <text x="175" y="659" text-anchor="middle" font-size="10" fill="#64748b">transactions</text>
  <text x="310" y="659" text-anchor="middle" font-size="10" fill="#64748b">transaction_items</text>
  <text x="460" y="659" text-anchor="middle" font-size="10" fill="#64748b">audit_log</text>
  <text x="320" y="678" text-anchor="middle" font-size="9" fill="#475569">All 3 tables written atomically — commit or full rollback</text>


  <!-- ═══════════════════════════════════════
       SECTION B — PROXY GOTCHA (right column)
  ═══════════════════════════════════════ -->

  <!-- header -->
  <rect x="610" y="62" width="310" height="30" rx="6" fill="#1a1a1f" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="765" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#fca5a5">Proxy Gotcha — same-class call</text>

  <!-- broken -->
  <rect x="610" y="104" width="310" height="118" rx="6" fill="#1a1a1f" stroke="#7f1d1d" stroke-width="1.2"/>
  <text x="765" y="122" text-anchor="middle" font-size="10" font-weight="600" fill="#ef4444">BROKEN — proxy bypassed</text>
  <text x="622" y="140" font-size="9" fill="#94a3b8">public void processBulk(...) {</text>
  <text x="634" y="154" font-size="9" fill="#94a3b8">createSale(req);  // this.createSale</text>
  <text x="634" y="168" font-size="9" fill="#ef4444">// ↑ @Transactional ignored!</text>
  <text x="622" y="182" font-size="9" fill="#94a3b8">}</text>
  <text x="622" y="196" font-size="9" fill="#94a3b8">@Transactional createSale() { ... }</text>
  <text x="765" y="214" text-anchor="middle" font-size="9" fill="#ef4444">both methods in the same class</text>

  <!-- fix -->
  <rect x="610" y="234" width="310" height="118" rx="6" fill="#0f1f10" stroke="#065f46" stroke-width="1.2"/>
  <text x="765" y="252" text-anchor="middle" font-size="10" font-weight="600" fill="#34d399">FIX — inject separate service</text>
  <text x="622" y="270" font-size="9" fill="#94a3b8">class BulkSalesService {</text>
  <text x="634" y="284" font-size="9" fill="#94a3b8">@Autowired SalesService sales;</text>
  <text x="634" y="298" font-size="9" fill="#94a3b8">public void processBulk(...) {</text>
  <text x="646" y="312" font-size="9" fill="#94a3b8">sales.createSale(req);</text>
  <text x="646" y="326" font-size="9" fill="#10b981">// ↑ goes through proxy ✓</text>
  <text x="634" y="340" font-size="9" fill="#94a3b8">}</text>

  <!-- ═══════════════════════════════════════
       SECTION C — PROPAGATION (right column)
  ═══════════════════════════════════════ -->

  <rect x="610" y="368" width="310" height="30" rx="6" fill="#1a1a1f" stroke="#312e81" stroke-width="1.5"/>
  <text x="765" y="388" text-anchor="middle" font-size="11" font-weight="700" fill="#818cf8">Propagation</text>

  <!-- propagation table -->
  <rect x="610" y="408" width="310" height="160" rx="6" fill="#1e293b" stroke="#312e81" stroke-width="1.2"/>

  <!-- rows -->
  <rect x="610" y="408" width="310" height="24" rx="0" fill="#1a1a2e"/>
  <text x="720" y="424" text-anchor="middle" font-size="9" font-weight="600" fill="#818cf8">Value</text>
  <text x="870" y="424" text-anchor="middle" font-size="9" font-weight="600" fill="#818cf8">Behaviour</text>

  <text x="680" y="446" text-anchor="middle" font-size="9" fill="#c4b5fd">REQUIRED (default)</text>
  <text x="870" y="446" text-anchor="middle" font-size="9" fill="#94a3b8">join or start new</text>

  <text x="680" y="464" text-anchor="middle" font-size="9" fill="#c4b5fd">REQUIRES_NEW</text>
  <text x="870" y="464" text-anchor="middle" font-size="9" fill="#94a3b8">always start new tx</text>

  <text x="680" y="482" text-anchor="middle" font-size="9" fill="#c4b5fd">SUPPORTS</text>
  <text x="870" y="482" text-anchor="middle" font-size="9" fill="#94a3b8">join if exists</text>

  <text x="680" y="500" text-anchor="middle" font-size="9" fill="#c4b5fd">NOT_SUPPORTED</text>
  <text x="870" y="500" text-anchor="middle" font-size="9" fill="#94a3b8">run without tx</text>

  <text x="680" y="518" text-anchor="middle" font-size="9" fill="#c4b5fd">NEVER</text>
  <text x="870" y="518" text-anchor="middle" font-size="9" fill="#94a3b8">throw if tx exists</text>

  <!-- REQUIRES_NEW note -->
  <rect x="612" y="534" width="306" height="28" rx="4" fill="#0f1a2e"/>
  <text x="765" y="548" text-anchor="middle" font-size="9" fill="#60a5fa">REQUIRES_NEW on audit = saves even if main tx rolls back</text>

  <!-- ═══════════════════════════════════════
       SECTION D — ISOLATION (right column)
  ═══════════════════════════════════════ -->

  <rect x="610" y="578" width="310" height="30" rx="6" fill="#1a1a1f" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="765" y="598" text-anchor="middle" font-size="11" font-weight="700" fill="#60a5fa">Isolation Levels</text>

  <rect x="610" y="618" width="310" height="110" rx="6" fill="#1e293b" stroke="#1e3a5f" stroke-width="1.2"/>
  <rect x="610" y="618" width="310" height="22" rx="0" fill="#0f1a2e"/>
  <text x="700" y="633" text-anchor="middle" font-size="9" font-weight="600" fill="#60a5fa">Level</text>
  <text x="870" y="633" text-anchor="middle" font-size="9" font-weight="600" fill="#60a5fa">Dirty reads?</text>

  <text x="700" y="654" text-anchor="middle" font-size="9" fill="#64748b">READ_UNCOMMITTED</text>
  <text x="870" y="654" text-anchor="middle" font-size="9" fill="#ef4444">yes</text>

  <text x="700" y="672" text-anchor="middle" font-size="9" fill="#38bdf8">READ_COMMITTED ← default</text>
  <text x="870" y="672" text-anchor="middle" font-size="9" fill="#34d399">no</text>

  <text x="700" y="690" text-anchor="middle" font-size="9" fill="#64748b">REPEATABLE_READ</text>
  <text x="870" y="690" text-anchor="middle" font-size="9" fill="#34d399">no</text>

  <text x="700" y="708" text-anchor="middle" font-size="9" fill="#64748b">SERIALIZABLE</text>
  <text x="870" y="708" text-anchor="middle" font-size="9" fill="#34d399">no (strictest)</text>

  <!-- ═══════════════════════════════════════
       ROLLBACK RULE CALLOUT (bottom strip)
  ═══════════════════════════════════════ -->
  <rect x="60" y="706" width="850" height="54" rx="8" fill="#1a1a1f" stroke="#334155" stroke-width="1.2"/>
  <text x="480" y="726" text-anchor="middle" font-size="11" font-weight="700" fill="#e2e8f0">Rollback Rules</text>
  <text x="200" y="746" text-anchor="middle" font-size="10" fill="#ef4444">Unchecked (RuntimeException)</text>
  <text x="200" y="758" text-anchor="middle" font-size="9" fill="#64748b">→ rollback automatically</text>
  <text x="480" y="746" text-anchor="middle" font-size="10" fill="#fbbf24">Checked (IOException etc.)</text>
  <text x="480" y="758" text-anchor="middle" font-size="9" fill="#64748b">→ commits by default — use rollbackFor = Exception.class</text>
  <text x="790" y="746" text-anchor="middle" font-size="10" fill="#34d399">Validate first, write after</text>
  <text x="790" y="758" text-anchor="middle" font-size="9" fill="#64748b">→ reads cheap, writes expensive</text>

  <!-- dividers in callout -->
  <line x1="360" y1="712" x2="360" y2="754" stroke="#334155" stroke-width="1"/>
  <line x1="660" y1="712" x2="660" y2="754" stroke="#334155" stroke-width="1"/>

  <!-- ═══════════════════════════════════════
       LAYER LABELS
  ═══════════════════════════════════════ -->
  <text x="46" y="96"  font-size="9" fill="#475569" text-anchor="middle" transform="rotate(-90,46,96)">CLIENT</text>
  <text x="46" y="188" font-size="9" fill="#7c3aed" text-anchor="middle" transform="rotate(-90,46,188)">PROXY</text>
  <text x="46" y="322" font-size="9" fill="#34d399" text-anchor="middle" transform="rotate(-90,46,322)">SERVICE</text>
  <text x="46" y="448" font-size="9" fill="#fbbf24" text-anchor="middle" transform="rotate(-90,46,448)">AUDIT</text>
  <text x="46" y="546" font-size="9" fill="#fb923c" text-anchor="middle" transform="rotate(-90,46,546)">REPO</text>
  <text x="46" y="654" font-size="9" fill="#38bdf8" text-anchor="middle" transform="rotate(-90,46,654)">DB</text>

</svg>
